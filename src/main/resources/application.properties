# 애플리케이션 이름
spring.application.name=demo

# Controller가 반환하는 JSP 기본 폴더
spring.mvc.view.prefix=/WEB-INF/views/
# JSP 파일의 확장자
spring.mvc.view.suffix=.jsp

# MySQL 접속 주소와 데이터베이스
spring.datasource.url=jdbc:mysql://192.168.10.18:3306/stockhub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# MySQL 접속 아이디
spring.datasource.username=stockhub_team
# MySQL 접속 비밀번호
spring.datasource.password=StockHub_1!
# MySQL 연결 드라이버
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis에서 DTO 클래스명을 짧게 사용
mybatis.type-aliases-package=com.kh.demo.member.dto
# MyBatis XML 파일 위치
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DB 컬럼명과 Java 필드명을 자동 연결
mybatis.configuration.map-underscore-to-camel-case=true

# 토스증권 API 접속 주소
toss.api.base-url=https://openapi.tossinvest.com
# 토스증권 API 인증 토큰 (환경변수 TOSS_API_TOKEN에서 주입, 실제 값은 여기 적지 않음)
toss.api.token=${TOSS_API_TOKEN:}

# 업로드 파일 한 개의 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 한 요청에서 업로드할 수 있는 최대 크기
spring.servlet.multipart.max-request-size=50MB
# 모든 업로드 파일의 기본 폴더
file.upload-dir=uploads
# 프로필 이미지 저장 폴더
file.upload-dir.profile=uploads/profile


