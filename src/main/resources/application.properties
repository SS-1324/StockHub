spring.application.name=demo

#jsp view 경로 설정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#DB접속정보
spring.datasource.url=jdbc:mysql://localhost:3306/sample?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=spring
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mybatis 설정
mybatis.type-aliases-package=com.kh.demo.member.dto
mybatis.mapper-locations=classpath:mappers/**/*.xml
# 컬럼명(snake_case) <-> 자바 필드명(camelCase) 자동매핑
mybatis.configuration.map-underscore-to-camel-case=true


#파일 업로드 설정
#업로드 파일 1개 최대크기
spring.servlet.multipart.max-file-size=10MB
#업로드 요청의 최대크기
spring.servlet.multipart.max-request-size=50MB
#실제 이미지 파일이 저장될 서버의 경로
file.upload-dir=uploads
file.upload-dir.profile=uploads/profile