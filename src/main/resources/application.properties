# 애플리케이션 이름
spring.application.name=demo

# Controller가 반환하는 JSP 기본 폴더
spring.mvc.view.prefix=/WEB-INF/views/
# JSP 파일의 확장자
spring.mvc.view.suffix=.jsp

# MySQL 접속 주소와 데이터베이스
spring.datasource.url=jdbc:mysql://192.168.10.18:3306/stockhub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# MySQL 접속 아이디/비밀번호 - 환경변수(DB_USERNAME/DB_PASSWORD)로 덮어쓸 수 있음.
# 팀 공용 DB라 기존 값을 기본값으로 남겨둠(설정 안 하면 지금까지처럼 그대로 동작).
# 이 값 자체가 git에 평문으로 남아있는 문제는 별개 - 팀 논의 후 별도로 교체 필요.
spring.datasource.username=${DB_USERNAME:stockhub_team}
spring.datasource.password=${DB_PASSWORD:StockHub_1!}
# MySQL 연결 드라이버
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis에서 DTO 클래스명을 짧게 사용
mybatis.type-aliases-package=com.kh.demo.member.dto
# MyBatis XML 파일 위치
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DB 컬럼명과 Java 필드명을 자동 연결
mybatis.configuration.map-underscore-to-camel-case=true

# 업로드 파일 한 개의 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 한 요청에서 업로드할 수 있는 최대 크기
spring.servlet.multipart.max-request-size=50MB
# 모든 업로드 파일의 기본 폴더
file.upload-dir=uploads
# 프로필 이미지 저장 폴더
file.upload-dir.profile=uploads/profile

# Gmail SMTP 이메일 발송 설정
# 실제 Gmail 주소와 앱 비밀번호는 코드에 적지 않고 IntelliJ 환경변수로 입력
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${STOCKHUB_MAIL_USERNAME:}
spring.mail.password=${STOCKHUB_MAIL_APP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 마지막 서버 요청 후 30분 동안 요청이 없으면 세션 만료
server.servlet.session.timeout=30m